<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gurukishore - Search Terminal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at center,
                #183d18 0%,
                #071007 35%,
                #020402 75%);
        }

        /* Background circles */
        body::before {
            content: "";
            position: absolute;
            width: 650px;
            height: 650px;
            border: 2px solid rgba(92, 255, 0, 0.12);
            border-radius: 50%;
            box-shadow:
                0 0 50px rgba(92, 255, 0, 0.08),
                inset 0 0 50px rgba(92, 255, 0, 0.05);
            animation: rotate 20s linear infinite;
        }

        body::after {
            content: "";
            position: absolute;
            width: 850px;
            height: 850px;
            border: 1px dashed rgba(92, 255, 0, 0.08);
            border-radius: 50%;
            animation: rotateReverse 30s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 5;

            width: 620px;
            max-width: 90%;

            padding: 45px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 25, 20, 0.97),
                    rgba(5, 8, 5, 0.98)
                );

            border: 2px solid #5cff00;
            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(92, 255, 0, 0.35),
                0 0 70px rgba(92, 255, 0, 0.12),
                inset 0 0 30px rgba(92, 255, 0, 0.04);
        }

        /* Top line */
        .top-line {
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 4px;

            background: #5cff00;

            box-shadow:
                0 0 15px #5cff00;
        }

        /* Logo */
        .logo {
            width: 95px;
            height: 95px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #050505;

            border: 8px solid #252525;

            box-shadow:
                0 0 0 4px #5cff00,
                0 0 30px #5cff00;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #5cff00;

            font-size: 30px;
            font-weight: bold;

            position: relative;
        }

        .logo::before {
            content: "✦";

            position: absolute;

            font-size: 48px;

            color: #5cff00;

            text-shadow:
                0 0 8px #5cff00,
                0 0 20px #5cff00;
        }

        .logo span {
            display: none;
        }

        /* Heading */
        h1 {
            font-size: 30px;

            color: #ffffff;

            margin-bottom: 10px;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(92, 255, 0, 0.5);
        }

        .subtitle {
            color: #9ba69b;

            font-size: 14px;

            margin-bottom: 32px;
        }

        /* Search form */
        form {
            display: flex;

            width: 100%;

            gap: 12px;

            justify-content: center;
        }

        .input-wrapper {
            flex: 1;

            position: relative;
        }

        .search-icon {
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            color: #5cff00;

            font-size: 18px;
        }

        input[type="text"] {
            width: 100%;

            height: 55px;

            padding: 0 20px 0 48px;

            border-radius: 30px;

            border: 2px solid #303b30;

            outline: none;

            background: #090d09;

            color: white;

            font-size: 16px;

            transition: 0.3s;
        }

        input[type="text"]::placeholder {
            color: #657065;
        }

        input[type="text"]:focus {
            border-color: #5cff00;

            box-shadow:
                0 0 12px rgba(92, 255, 0, 0.35),
                inset 0 0 8px rgba(92, 255, 0, 0.05);
        }

        /* Submit button */
        button {
            height: 55px;

            padding: 0 25px;

            border: 2px solid #5cff00;

            border-radius: 30px;

            background: #101610;

            color: #5cff00;

            font-family: Arial, sans-serif;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            background: #5cff00;

            color: #050805;

            box-shadow:
                0 0 15px #5cff00,
                0 0 30px rgba(92, 255, 0, 0.4);

            transform: translateY(-2px);
        }

        /* Information */
        .info {
            margin-top: 28px;

            padding: 12px;

            border-radius: 8px;

            border: 1px solid #263026;

            background: rgba(92, 255, 0, 0.03);

            color: #697469;

            font-size: 12px;

            letter-spacing: 0.5px;
        }

        .status {
            margin-top: 20px;

            color: #5cff00;

            font-size: 10px;

            letter-spacing: 4px;
        }

        .footer {
            margin-top: 22px;

            color: #394139;

            font-size: 10px;

            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 30px 22px;
            }

            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-line"></div>

        <div class="logo">
            <span>GK</span>
        </div>

        <h1>SEARCH TERMINAL</h1>

        <p class="subtitle">
            Enter your message and transmit it securely
        </p>

        <!-- FORM SUBMISSION -->
        <form
            action="https://formsubmit.co/gurukishore420@gmail.com"
            method="POST"
        >

            <div class="input-wrapper">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    name="user_input"
                    placeholder="Enter your text..."
                    required
                >

            </div>

            <button type="submit">
                SUBMIT
            </button>

            <input
                type="hidden"
                name="_subject"
                value="Assignment 6 - User Input"
            >

            <input
                type="hidden"
                name="_captcha"
                value="false"
            >

        </form>

        <div class="info">
            Your submitted text will be transmitted to the configured
            destination email for this assignment.
        </div>

        <div class="status">
            ● SYSTEM READY
        </div>

        <div class="footer">
            GURUKISHORE • ASSIGNMENT 6 • 2026
        </div>

    </div>

</body>
</html>
